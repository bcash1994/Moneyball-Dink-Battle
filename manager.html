<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moneyball Manager</title><style>:root{--n:#0b1f44;--g:#65c70f;--l:#dbe3ec}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f9fb;color:#15233d}header{text-align:center;background:white;padding:22px}h1{margin:0;color:var(--n)}.wrap{max-width:1400px;margin:auto;padding:18px}.panel,.summary>div{background:white;border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:15px}.top,.filters,.finalgame{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.players input{width:100%}select,input{padding:9px;border:1px solid var(--l);border-radius:8px}.token{min-width:250px}.share{min-width:280px}.btn{padding:9px 12px;border:0;border-radius:8px;background:var(--g);color:white;font-weight:bold}.light{background:white;color:var(--n);border:1px solid var(--l)}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:8px;border-bottom:1px solid #edf1f4;text-align:left}.qual{background:#f5fced}.round{font-weight:bold;color:var(--g);margin-top:18px}.game{border:1px solid var(--l);border-radius:9px;padding:10px;margin:8px 0}.g{display:grid;grid-template-columns:1fr 65px 25px 65px 1fr 100px;gap:8px;align-items:center}.score{width:65px}.finalgrid{display:grid;grid-template-columns:1fr 120px 1fr;gap:12px}.team,.versus{text-align:center;padding:14px}.champ{background:var(--n);color:white;padding:14px;text-align:center;border-radius:10px}.note{font-size:13px;color:#6f7d91}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.players{grid-template-columns:repeat(2,1fr)}.g{grid-template-columns:1fr 55px 20px 55px 1fr}.g button{grid-column:1/-1}.finalgrid{grid-template-columns:1fr}}</style></head><body><header><h1>1st MONEYBALL DINK BATTLE 🏓 💰</h1><b>Eat, Dink, Sleep, Repeat</b></header><div class="wrap"><div class="panel top"><b>Size</b><select id="count" onchange="PB.load(+this.value)"><option>8</option><option>9</option><option>10</option><option>11</option><option selected>12</option><option>13</option><option>14</option><option>15</option></select><input id="ghToken" class="token" type="password" placeholder="GitHub access token"><button class="btn" onclick="PB.publish().catch(e=>PB.status(e.message))">Publish Live Scores</button><input id="shareLink" class="share" readonly><button id="copyBtn" class="btn light">Copy Player Link</button><span id="syncStatus"></span></div><div class="summary"><div>Round 1<br><b id="s1"></b></div><div>Round 2<br><b id="s2"></b></div><div>Final<br><b>4</b></div><div>Complete<br><b id="done">0</b></div><div>Champion<br><b id="champ">TBD</b></div></div><div class="panel"><h2>Player Names</h2><div id="players" class="players"></div></div><div class="panel"><div id="format" class="note"></div></div><div class="panel"><h2>Round 1 Pool</h2><div id="r1stand"></div><button id="lock2" class="btn" onclick="PB.lock2()">Set Qualifiers</button></div><div class="panel"><h2>Round 1 Scores</h2><div class="filters">Round <select id="r1RoundFilter" onchange="PB.renderGames('r1')"></select></div><div id="r1games"></div></div><div class="panel"><h2>Round 2 Pool</h2><div id="seeds" class="note"></div><div id="r2stand"></div><button class="btn" onclick="PB.lockF()">Set Top 4 for Final</button></div><div class="panel"><h2>Round 2 Scores</h2><div class="filters">Round <select id="r2RoundFilter" onchange="PB.renderGames('r2')"></select></div><div id="r2games"></div></div><div class="panel"><h2>Championship Final: Best of 3</h2><div id="final"></div></div></div><script src="app.js"></script><script>PB.init('manager')</script></body></html>
