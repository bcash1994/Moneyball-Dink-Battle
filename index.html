<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1st MONEYBALL DINK BATTLE 🏓 💰</title><style>:root{--n:#0b1f44;--g:#65c70f;--l:#dbe3ec}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f9fb;color:#15233d}header{text-align:center;background:white;padding:22px;border-bottom:1px solid var(--l)}h1{margin:0;color:var(--n)}main{max-width:1200px;margin:auto;padding:18px}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:14px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{background:#eff9e7;color:#4c9707;padding:5px 9px;border-radius:999px;font-weight:700}select{padding:8px;border:1px solid var(--l);border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #edf1f4;text-align:left}th{color:var(--n)}.game{padding:10px;border:1px solid var(--l);border-radius:9px;margin:8px 0}.qual{background:#f5fced}.champ{background:var(--n);color:white;padding:14px;border-radius:10px;text-align:center;font-weight:800}.note{color:#6f7d91;font-size:13px}@media(max-width:700px){table{font-size:12px}}</style></head><body><header><h1>1st MONEYBALL DINK BATTLE 🏓 💰</h1><b>Eat, Dink, Sleep, Repeat</b></header><main><div class="card top"><b>Tournament Size</b><select id="size" onchange="show()"><option>8</option><option>9</option><option>10</option><option>11</option><option selected>12</option><option>13</option><option>14</option><option>15</option></select><span class="badge">VIEW ONLY</span><span class="note">Updates automatically</span></div><div class="card"><h2>Live Standings</h2><div id="stand"></div></div><div class="card"><h2>Live Scores</h2><div id="games"></div></div><div class="card"><h2>Championship Final</h2><div id="final"></div></div></main><script>let D={};const url='https://raw.githubusercontent.com/bcash1994/Moneyball-Dink-Battle/main/scores.json';async function load(){try{D=await(await fetch(url+'?t='+Date.now(),{cache:'no-store'})).json();show()}catch(e){stand.innerHTML='<p class="note">Waiting for tournament scores.</p>'}}function show(){let n=size.value,s=D[n];if(!s){stand.innerHTML='<p class="note">Tournament has not been published yet.</p>';games.innerHTML='';final.innerHTML='';return}let rows=s.standings||[];stand.innerHTML='<table><tr><th>Rank</th><th>Player</th><th>W</th><th>L</th><th>Diff</th></tr>'+rows.map((x,i)=>'<tr class="'+(x.advance?'qual':'')+'"><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.w+'</td><td>'+x.l+'</td><td>'+x.diff+'</td></tr>').join('')+'</table>';games.innerHTML=(s.games||[]).map(g=>'<div class="game"><b>'+esc(g.a)+'</b> '+g.sa+' vs '+g.sb+' <b>'+esc(g.b)+'</b><div class="note">'+esc(g.stage)+' • '+esc(g.status)+'</div></div>').join('');final.innerHTML=s.champion?'<div class="champ">🏆 Champion: '+esc(s.champion)+' 💰</div>':'<p class="note">Final not completed.</p>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();setInterval(load,10000)</script></body></html>
